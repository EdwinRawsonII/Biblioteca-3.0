<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión en Tacuarita</title>
    <link rel="stylesheet" href="./login.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="tacuara">
            <img class="image-tacuara" src="./images/tacuarita.png" alt="img" id="logo">
            <h1>Iniciar Sesión en Tacuarita</h1>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <div class="options">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <p>¿No tienes cuenta? <a href="./registro.html">Regístrate aquí</a></p>
                <div class="social-login">
                    <p>O inicia sesión con:</p>
                    <div class="social-icons">
                        <a href="www.facebook.com"><img src="./images/facebook-ico.png" alt="Facebook"></a>
                        <a href="www.instagram.com"><img src="./images/instagram-ico.png" alt="Instagram"></a>
                        <a href="www.google.com"><img src="./images/google-ico.png" alt="Google"></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <br>
    <br>

    <br>
    <br>
    <footer>
        <p class="derechos">®Desing by: Angel Perla <a href="#"></a></p>
    </footer>


    <script src="/script.js"></script>
    <script src="/animation.js"></script>
    <script src="/chords.js"></script>
    <script src="/library.js"></script>
    <script src="/piano.js"></script>
    <script src="/intervalos.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
